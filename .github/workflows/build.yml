name: Build app
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-with-artifacts:
    strategy:
      matrix:
        os:
          [
            { name: 'linux', image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-latest' }
          ]
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Github checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@0a44ba7841725637a19e2c290e77d9f5f6b49d4d # v4.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v1.1.3
      - name: Install WiX build tools
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix
      - name: Build app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run make
      - name: Upload squirrel.windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-squirrel
          path: out/make/squirrel.windows
      - name: Upload msi artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-msi
          path: out/make/wix
      - name: Upload zip.windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-zip.windows
          path: out/make/zip
      - name: Upload zip.linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-zip.linux
          path: out/make/zip
      - name: Upload deb artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-deb
          path: out/make/deb
      - name: Upload rpm artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-rpm
          path: out/make/rpm
      - name: Upload appimage artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: artifacts-appimage
          path: out/make/appimage

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-with-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.0
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}